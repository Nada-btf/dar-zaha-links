<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dar Zaha</title>
<style>
:root{
  /* Easy to change: brand colors */
  --bg:#f6f0e4; --card:#fffdf8; --text:#1d2a21; --muted:#6b6a58;
  --accent:#14452a; --accent2:#b8902f; --border:#e4d8bf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a14; --card:#16251c; --text:#e9f3ec; --muted:#9db5a5;
    --accent:#5cc98c; --accent2:#d4ae4a; --border:#25382d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a14; --card:#16251c; --text:#e9f3ec; --muted:#9db5a5;
  --accent:#5cc98c; --accent2:#d4ae4a; --border:#25382d; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
  display:flex; justify-content:center; padding:40px 20px;
}
main{width:100%; max-width:440px; text-align:center}
.logo{width:210px; height:210px; margin:0 auto 10px; border-radius:50%; overflow:hidden; background:#f6f0e4; box-shadow:0 6px 20px rgba(0,0,0,.12)}
.logo img{width:100%; height:100%; object-fit:cover; display:block}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
h1{margin:0 0 6px; font-size:30px; letter-spacing:.5px}
p.tag{margin:0 0 28px; color:var(--muted); font-size:16px}
.links{display:flex; flex-direction:column; gap:14px}
a.btn{
  display:flex; align-items:center; gap:14px; padding:16px 20px;
  background:var(--card); color:var(--text); text-decoration:none;
  border:1px solid var(--border); border-radius:16px; font-size:17px;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-weight:600;
  transition:transform .15s, border-color .15s;
}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px); border-color:var(--accent)}
a.btn svg{width:24px; height:24px; flex:none; color:var(--accent)}
a.btn span{flex:1; text-align:left}
a.btn .arrow{color:var(--muted); font-weight:400}
footer{margin-top:36px; color:var(--muted); font-size:13px}
</style>
</head>
